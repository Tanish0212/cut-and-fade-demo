<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cut And Fade Salon · Men's barbershop in Al Hamriya, Dubai</title>
  <meta name="description" content="Haircuts, fades and shaving in Al Hamriya, Dubai. Open until midnight. Call 04 357 6844.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">

</head>
<body>
  <a class="skip-link" href="#main" data-t="skip">Skip to content</a>

  <p class="demo-banner" data-t="demoBanner"></p>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#top">
        <img class="brand-mark" src="images/logo.svg" width="40" height="40" alt="">
        <span class="brand-word">
          <span class="brand-name" lang="en" data-shop="shortName"></span>
          <span class="brand-sub" data-t="brandSub"></span>
        </span>
        <span class="visually-hidden" data-shop="name"></span>
      </a>
      <div class="header-actions">
        <div class="lang-toggle" role="group" data-t-aria="langLabel">
          <button type="button" data-lang="en" lang="en" aria-pressed="true">EN</button>
          <span class="lang-sep" aria-hidden="true"></span>
          <button type="button" data-lang="ar" lang="ar" aria-pressed="false">عربي</button>
        </div>
        <a class="btn btn-primary btn-sm js-tel" href="tel:+97143576844">
          <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.6 3.5h2.6l1.5 4.2-2 1.4a10.6 10.6 0 0 0 6.2 6.2l1.4-2 4.2 1.5v2.6a1.9 1.9 0 0 1-2 1.9A16.2 16.2 0 0 1 4.7 5.5a1.9 1.9 0 0 1 1.9-2Z"/></svg>
          <span class="label-long" data-t="callNow"></span><span class="label-short" data-t="call"></span>
        </a>
      </div>
    </div>
  </header>

  <main id="main">
    <!-- HERO -->
    <section class="hero" id="top" aria-labelledby="hero-title">
      <div class="container hero-grid">
        <div class="hero-copy">
          <p class="status js-status reveal"><span class="status-dot" aria-hidden="true"></span><span class="status-text"></span></p>
          <p class="eyebrow reveal" lang="en" data-shop="name"></p>
          <h1 class="hero-title js-hero-title" id="hero-title"></h1>
          <p class="lead reveal" data-t="heroSub"></p>
          <div class="actions reveal">
            <a class="btn btn-primary js-tel" href="tel:+97143576844">
              <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.6 3.5h2.6l1.5 4.2-2 1.4a10.6 10.6 0 0 0 6.2 6.2l1.4-2 4.2 1.5v2.6a1.9 1.9 0 0 1-2 1.9A16.2 16.2 0 0 1 4.7 5.5a1.9 1.9 0 0 1 1.9-2Z"/></svg>
              <span data-t="callNow"></span>
            </a>
            <a class="btn btn-ghost js-dir" href="#visit">
              <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.8-6.5-11a6.5 6.5 0 0 1 13 0c0 5.2-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.3"/></svg>
              <span data-t="directions"></span><span class="visually-hidden js-newtab"></span>
            </a>
          </div>
          <a class="rating js-rating js-reviews reveal" href="#reviews"></a>
        </div>
        <figure class="hero-media media reveal">
          <img class="js-hero-img" src="images/chair.svg" alt="" width="480" height="600" fetchpriority="high">
          <figcaption class="media-caption" data-t="heroCaption"></figcaption>
        </figure>
      </div>
    </section>

    <!-- FACT STRIP -->
    <section class="strip" data-t-aria="stripAria">
      <div class="container strip-grid">
        <div class="strip-item">
          <span class="strip-label" data-t="stripServicesLabel"></span>
          <span class="strip-value js-strip-services"></span>
        </div>
        <div class="strip-item">
          <span class="strip-label" data-t="stripHoursLabel"></span>
          <span class="strip-value" data-t="stripHours"></span>
        </div>
        <div class="strip-item">
          <span class="strip-label" data-t="stripRatingLabel"></span>
          <span class="strip-value"><span class="js-stars"></span> <span data-t="stripRating"></span></span>
        </div>
      </div>
    </section>

    <!-- SERVICES -->
    <section class="section" id="services" aria-labelledby="services-title">
      <div class="container">
        <header class="section-head reveal">
          <p class="kicker"><span class="kicker-num">01</span><span data-t="servicesKicker"></span></p>
          <h2 id="services-title" data-t="servicesTitle"></h2>
          <p class="section-intro" data-t="servicesIntro"></p>
        </header>
        <ul class="services js-services" role="list"></ul>
        <div class="services-foot reveal">
          <div>
            <p class="prices-note" data-t="pricesNote"></p>
            <p class="prices-sub" data-t="pricesSub"></p>
          </div>
          <a class="btn btn-primary js-tel" href="tel:+97143576844">
            <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.6 3.5h2.6l1.5 4.2-2 1.4a10.6 10.6 0 0 0 6.2 6.2l1.4-2 4.2 1.5v2.6a1.9 1.9 0 0 1-2 1.9A16.2 16.2 0 0 1 4.7 5.5a1.9 1.9 0 0 1 1.9-2Z"/></svg>
            <span data-t="callNow"></span>
          </a>
        </div>
      </div>
    </section>

    <!-- WHY -->
    <section class="section section-alt" id="why" aria-labelledby="why-title">
      <div class="container why-grid">
        <figure class="why-media media reveal">
          <img class="js-why-img" src="images/pole.svg" alt="" width="480" height="600" loading="lazy" decoding="async">
        </figure>
        <div>
          <header class="section-head section-head--stack reveal">
            <p class="kicker"><span class="kicker-num">02</span><span data-t="whyKicker"></span></p>
            <h2 id="why-title" data-t="whyTitle"></h2>
          </header>
          <ol class="why-list js-why" role="list"></ol>
        </div>
      </div>
    </section>

    <!-- CTA BAND -->
    <section class="cta-band" aria-labelledby="cta-title">
      <div class="container cta-inner reveal">
        <h2 id="cta-title" class="cta-title" data-t="ctaTitle"></h2>
        <div class="actions">
          <a class="btn btn-primary js-tel" href="tel:+97143576844">
            <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.6 3.5h2.6l1.5 4.2-2 1.4a10.6 10.6 0 0 0 6.2 6.2l1.4-2 4.2 1.5v2.6a1.9 1.9 0 0 1-2 1.9A16.2 16.2 0 0 1 4.7 5.5a1.9 1.9 0 0 1 1.9-2Z"/></svg>
            <span data-t="callNow"></span>
          </a>
          <a class="btn btn-ghost js-dir" href="#visit">
            <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.8-6.5-11a6.5 6.5 0 0 1 13 0c0 5.2-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.3"/></svg>
            <span data-t="directions"></span><span class="visually-hidden js-newtab"></span>
          </a>
        </div>
      </div>
    </section>

    <!-- REVIEWS -->
    <section class="section" id="reviews" aria-labelledby="reviews-title">
      <div class="container reviews-grid">
        <div class="reviews-side reveal">
          <p class="kicker"><span class="kicker-num">03</span><span data-t="reviewsKicker"></span></p>
          <h2 id="reviews-title" data-t="reviewsTitle"></h2>
          <div class="score">
            <span class="score-value js-score" lang="en" dir="ltr"></span>
            <div class="score-meta">
              <span class="js-stars score-stars"></span>
              <span class="score-out" data-t="outOf"></span>
            </div>
          </div>
          <p class="score-count" data-t="basedOn"></p>
          <a class="text-link js-reviews" href="#reviews">
            <span data-t="readMore"></span><span class="visually-hidden js-newtab"></span>
            <svg class="icon icon-arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12h15M14 6.5l5.5 5.5-5.5 5.5"/></svg>
          </a>
        </div>
        <ul class="reviews js-reviews-list" role="list"></ul>
      </div>
    </section>

    <!-- VISIT -->
    <section class="section section-alt" id="visit" aria-labelledby="visit-title">
      <div class="container">
        <header class="section-head reveal">
          <p class="kicker"><span class="kicker-num">04</span><span data-t="visitKicker"></span></p>
          <h2 id="visit-title" data-t="visitTitle"></h2>
        </header>
        <dl class="visit-info reveal">
          <div>
            <dt data-t="addressLabel"></dt>
            <dd class="address js-address"></dd>
          </div>
          <div>
            <dt data-t="hoursLabel"></dt>
            <dd><span data-t="hoursValue"></span>
              <span class="status status--inline js-status"><span class="status-dot" aria-hidden="true"></span><span class="status-text"></span></span>
            </dd>
          </div>
          <div>
            <dt data-t="phoneLabel"></dt>
            <dd><a class="phone-link js-tel js-phone" href="tel:+97143576844">04 357 6844</a></dd>
          </div>
        </dl>
        <div class="map reveal">
          <iframe class="js-map" title="Map" width="100%" height="350" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
        </div>
        <div class="actions visit-actions reveal">
          <a class="btn btn-primary js-dir" href="#visit">
            <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.8-6.5-11a6.5 6.5 0 0 1 13 0c0 5.2-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.3"/></svg>
            <span data-t="directions"></span><span class="visually-hidden js-newtab"></span>
          </a>
          <a class="btn btn-ghost js-tel" href="tel:+97143576844">
            <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.6 3.5h2.6l1.5 4.2-2 1.4a10.6 10.6 0 0 0 6.2 6.2l1.4-2 4.2 1.5v2.6a1.9 1.9 0 0 1-2 1.9A16.2 16.2 0 0 1 4.7 5.5a1.9 1.9 0 0 1 1.9-2Z"/></svg>
            <span data-t="callNow"></span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div class="footer-brand">
        <img src="images/logo.svg" width="48" height="48" alt="" loading="lazy">
        <div>
          <p class="footer-name" lang="en" data-shop="name"></p>
          <p class="footer-tag" data-t="footerTag"></p>
        </div>
      </div>
      <div class="footer-col">
        <p class="footer-label" data-t="addressLabel"></p>
        <address class="js-address"></address>
      </div>
      <div class="footer-col">
        <p class="footer-label" data-t="footerContact"></p>
        <p><a class="js-tel js-phone" href="tel:+97143576844">04 357 6844</a></p>
        <p><a class="js-dir" href="#visit"><span data-t="directions"></span><span class="visually-hidden js-newtab"></span></a></p>
      </div>
    </div>
    <div class="container footer-bottom">
      <p>© <span class="js-year"></span> <span lang="en" data-shop="name"></span></p>
      <p data-t="credit"></p>
    </div>
  </footer>

  <a class="fab js-tel" href="tel:+97143576844" data-t-aria="callAria">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.6 3.5h2.6l1.5 4.2-2 1.4a10.6 10.6 0 0 0 6.2 6.2l1.4-2 4.2 1.5v2.6a1.9 1.9 0 0 1-2 1.9A16.2 16.2 0 0 1 4.7 5.5a1.9 1.9 0 0 1 1.9-2Z"/></svg>
  </a>
