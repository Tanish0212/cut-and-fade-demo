<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Counter poster · Cut And Fade Salon</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@500;700&display=swap">
  <style>
    /* Printable A5 counter poster. Print with "Margins: none" and "Background graphics" on. */
    @page { size: A5 portrait; margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: #2b2825; font-family: Inter, Arial, sans-serif; color: #111; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .toolbar { display: flex; justify-content: center; gap: 12px; padding: 20px 16px 0; }
    .toolbar button { font: 600 15px Inter, sans-serif; padding: 12px 22px; min-height: 44px; border: 0; border-radius: 2px; background: #c9a96a; color: #0e0d0c; cursor: pointer; }
    .toolbar a { font: 500 15px Inter, sans-serif; color: #e9e1d3; align-self: center; }
    .sheet {
      width: 148mm; height: 210mm; margin: 20px auto 40px; background: #fbf8f2;
      padding: 13mm 12mm 11mm; display: flex; flex-direction: column; align-items: center; text-align: center;
      position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.4); overflow: hidden;
    }
    .sheet::before { content: ""; position: absolute; inset: 6mm; border: 0.35mm solid #c9a96a; pointer-events: none; }
    .logo { width: 20mm; height: 20mm; }
    .name { margin: 4mm 0 0; font: 700 15mm/0.9 'Barlow Condensed', 'Arial Narrow', sans-serif; text-transform: uppercase; letter-spacing: .01em; }
    .sub { margin: 2.5mm 0 0; font: 600 2.9mm Inter, sans-serif; letter-spacing: .28em; text-transform: uppercase; color: #8a6d35; }
    .rule { width: 16mm; height: 0.4mm; background: #c9a96a; margin: 6mm 0 5mm; }
    .cta { margin: 0; font: 700 7.4mm/1 'Barlow Condensed', sans-serif; text-transform: uppercase; letter-spacing: .02em; }
    .cta-ar { margin: 2mm 0 0; font: 500 4.2mm/1.4 'IBM Plex Sans Arabic', sans-serif; color: #444; }
    .qr-box { margin-top: 6mm; padding: 4mm; background: #fff; border: 0.3mm solid #e2dccf; }
    .qr { display: block; width: 52mm; height: 52mm; }
    .phone-label { margin: 6mm 0 0; font: 600 2.8mm Inter, sans-serif; letter-spacing: .26em; text-transform: uppercase; color: #8a6d35; }
    .phone { margin: 1.5mm 0 0; font: 700 11mm/1 'Barlow Condensed', sans-serif; letter-spacing: .04em; }
    .ar-inline { letter-spacing: 0; font-family: "IBM Plex Sans Arabic", sans-serif; font-size: 3.3mm; }
    .foot { margin-top: auto; font: 500 3.1mm/1.5 Inter, sans-serif; color: #444; }
    .foot b { font-weight: 600; color: #111; }
    @media print {
      body { background: none; }
      .toolbar { display: none; }
      .sheet { margin: 0; box-shadow: none; }
    }
    @media screen and (max-width: 600px) {
      .sheet { zoom: .62; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button type="button" onclick="window.print()">Print poster (A5)</button>
    <a href="./">Back to website</a>

    </div>
